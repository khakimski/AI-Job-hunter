services:
  postgres:
    image: postgres:16-alpine
    container_name: jobpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobpilot
      POSTGRES_USER: jobpilot_user
      POSTGRES_PASSWORD: jobpilot_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpilot_user -d jobpilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: jobpilot-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://jobpilot_user:jobpilot_password@postgres:5432/jobpilot
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
